<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOCA tag">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>TOCA tag</title>
<link rel="icon" href="mark.png">
<style>
@font-face{font-family:"Inter";font-weight:100 900;font-style:normal;font-display:swap;src:url("fonts/inter-latin-wght-normal.woff2") format("woff2")}
/* Layout: wallpaper > barra de menus > uma janela de vidro > Dock para trocar de área. Tema único, escuro e dourado, da marca. */
:root{
  color-scheme:dark;
  --night:#16130f;
  --ink:#f7f2e9;
  --ink-soft:rgba(247,242,233,.64);
  --ink-faint:rgba(247,242,233,.38);
  --gold:#dcb872;
  --gold-deep:#a37d3c;
  --glass:rgba(255,255,255,.075);
  --glass-hi:rgba(255,255,255,.13);
  --glass-low:rgba(0,0,0,.22);
  --stroke:rgba(255,255,255,.16);
  --stroke-soft:rgba(255,255,255,.09);
  --ok:#62d894; --wait:#f4c552; --bad:#ff7466;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r-win:20px; --r-card:14px; --r-ctl:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.4;
  background:
    radial-gradient(70% 55% at 0% 0%, rgba(220,184,114,.16), transparent 62%),
    radial-gradient(circle at 100% 0%, transparent 0, transparent 26%, var(--night) 70%),
    repeating-radial-gradient(circle at 100% 0%, transparent 0 62px, rgba(220,184,114,.09) 62px 63.5px),
    var(--night);
  background-attachment:fixed;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  border:1px solid var(--stroke);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 24px 60px rgba(0,0,0,.38);
}

/* Barra de menus */
.menubar{height:30px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:rgba(20,16,12,.38);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--stroke-soft);font-size:13px}
.menubar img{height:17px;width:auto}
.menubar b{font-weight:600;letter-spacing:.01em}
.menubar .sp{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--wait)}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--bad)}
#clock{font-variant-numeric:tabular-nums;color:var(--ink-soft)}

/* Janela */
.stage{flex:1;min-height:0;display:flex;padding:16px 16px 8px}
.window{flex:1;min-width:0;max-width:1240px;margin:0 auto;border-radius:var(--r-win);display:flex;flex-direction:column;overflow:hidden}
.titlebar{flex:none;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--stroke-soft);background:rgba(255,255,255,.04)}
.titlebar h1{font-size:14px;font-weight:600;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;display:flex}
.side{flex:none;width:214px;padding:14px 10px;border-right:1px solid var(--stroke-soft);background:var(--glass-low);display:flex;flex-direction:column;gap:4px}
.side .brand{padding:6px 8px 14px}
.side .brand img{width:150px;display:block}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--ink-soft);font-weight:500}
.side button:hover{background:var(--glass)}
.side button[aria-current="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.side button svg{color:var(--gold)}
.side .n{margin-left:auto;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.main{flex:1;min-width:0;overflow:auto;padding:20px 22px 26px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1;min-width:160px;text-wrap:balance}
.sub{color:var(--ink-soft);margin:-10px 0 16px;max-width:64ch}

/* Controles */
.btn{border:1px solid var(--stroke);background:var(--glass-hi);border-radius:var(--r-ctl);padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn:hover{background:rgba(255,255,255,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:#241a08;border-color:transparent;box-shadow:none}
.btn.gold:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--ink-soft);font-weight:500}
.inp{width:100%;background:rgba(0,0,0,.26);border:1px solid var(--stroke);border-radius:var(--r-ctl);padding:9px 12px;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.inp::placeholder{color:var(--ink-faint)}
select.inp{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.search{max-width:260px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:rgba(0,0,0,.3);border:1px solid var(--stroke-soft);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 8px rgba(0,0,0,.3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--stroke-soft);background:rgba(0,0,0,.22);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
.chip.ok{color:var(--ok)}.chip.ok::before{background:var(--ok)}
.chip.wait{color:var(--wait)}.chip.wait::before{background:var(--wait)}
.chip.bad{color:var(--bad)}.chip.bad::before{background:var(--bad)}
.chip.plain::before{display:none}

/* Listas */
.card{border-radius:var(--r-card);background:var(--glass);border:1px solid var(--stroke-soft)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--stroke-soft);min-width:0}
.row:last-child{border-bottom:0}
button.row{border-left:0;border-right:0;border-top:0;background:none;text-align:left;width:100%}
button.row:hover{background:var(--glass)}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:600;overflow-wrap:anywhere}
.who span{display:block;font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.av{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;background:rgba(220,184,114,.22);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink);border:1px solid var(--stroke)}
.av.lg{width:132px;height:132px;font-size:44px;border-width:2px}
.av.md{width:76px;height:76px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:10px}
.tile h3{margin:0;font-size:17px;font-weight:700}
.tile p{margin:0;color:var(--ink-soft);font-size:13.5px}
.empty{padding:38px 20px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.banner{padding:10px 14px;border-radius:var(--r-ctl);background:rgba(244,197,82,.12);border:1px solid rgba(244,197,82,.35);margin-bottom:14px;font-size:14px}

/* Chamada ao vivo */
.live{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px;align-items:start}
.reader{padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;position:sticky;top:0}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid var(--stroke)}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--gold);opacity:0;animation:pulse 2.6s ease-out infinite}
.ring::after{animation-delay:1.3s}
.ring img{width:74px}
@keyframes pulse{0%{transform:scale(.72);opacity:.75}100%{transform:scale(1.28);opacity:0}}
.blip{display:flex;flex-direction:column;align-items:center;gap:8px}
.blip.new{animation:pop .32s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:.3}to{transform:none;opacity:1}}
.blip .av.lg{box-shadow:0 0 0 4px rgba(98,216,148,.5),0 16px 40px rgba(0,0,0,.4)}
.blip.dup .av.lg{box-shadow:0 0 0 4px rgba(244,197,82,.55),0 16px 40px rgba(0,0,0,.4)}
.blip.err .av.lg{box-shadow:0 0 0 4px rgba(255,116,102,.55),0 16px 40px rgba(0,0,0,.4)}
.blip h3{margin:6px 0 0;font-size:22px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.blip p{margin:0;color:var(--ink-soft)}
.blip .msg{font-weight:700;font-size:16px;color:var(--ok)}
.askrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}.blip.ask .msg{color:var(--wait)}
.blip.dup .msg{color:var(--wait)}.blip.err .msg{color:var(--bad)}
.reader h3.idle{margin:0;font-size:19px}
.reader small{color:var(--ink-soft);font-size:13px;max-width:34ch}
.typing{font-variant-numeric:tabular-nums;letter-spacing:.14em;min-height:20px;color:var(--gold);font-weight:600}
.coderow{display:flex;gap:8px;width:100%}
.count{font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.count b{font-size:26px;color:var(--ink);font-weight:700}

/* Cartão digital */
.wallet{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:22px;align-items:start}
.pass{border-radius:22px;padding:20px;min-height:230px;gap:12px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;color:#231806;
  background:linear-gradient(160deg,#e6c888,#c9a25c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 26px 50px rgba(0,0,0,.45)}
.pass::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 100% 0%,transparent 0 30px,rgba(35,24,6,.07) 30px 31px)}
.pass>*{position:relative}
.pass .top{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.pass .top span{margin-left:auto;font-weight:600;font-size:12.5px;opacity:.75}
.pass .mid{display:flex;align-items:center;gap:14px}
.pass .av{border-color:rgba(255,255,255,.7);color:#231806;background:rgba(255,255,255,.35)}
.pass .mid b{display:block;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.pass .mid span{font-size:13px;opacity:.8}
.pass .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pass .code{font-size:30px;font-weight:700;letter-spacing:.16em;font-variant-numeric:tabular-nums}
.pass .lblc{font-size:12px;opacity:.75;display:block}
.bar{height:4px;border-radius:2px;background:rgba(35,24,6,.2);overflow:hidden;margin-top:6px;width:150px}
.bar i{display:block;height:100%;background:#231806;border-radius:2px;transition:width 1s linear}
.note{font-size:13.5px;color:var(--ink-soft);margin:14px 0 0;max-width:46ch}

/* Dock */
.dockwrap{flex:none;display:flex;justify-content:center;padding:0 12px 10px}
.dock{display:flex;gap:6px;padding:7px 9px;border-radius:22px}
.dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 10px;font-size:11.5px;font-weight:600;color:var(--ink-soft);transition:transform .16s ease;transform-origin:bottom center;position:relative}
.dock button .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--stroke);background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px rgba(0,0,0,.3);color:var(--ink)}
.dock button:hover{transform:scale(1.14) translateY(-3px)}
.dock button[aria-current="true"]{color:var(--ink)}
.dock button[aria-current="true"] .ic{background:var(--gold);color:#241a08}
.dock button[aria-current="true"]::after{content:"";position:absolute;bottom:-5px;width:4px;height:4px;border-radius:50%;background:var(--ink)}

/* Folha (modal) */
.veil{position:fixed;inset:0;background:rgba(6,5,4,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.veil.open{display:flex}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;border-radius:18px;padding:22px;background:rgba(38,32,26,.72);animation:pop .22s ease-out}
.sheet.wide{width:min(980px,100%)}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .sub{margin:0 0 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.photo{display:flex;align-items:center;gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;border:1px solid var(--stroke-soft);background:rgba(0,0,0,.2);font-size:14px;color:var(--ink)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.foot .l{margin-right:auto}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin-top:8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--stroke-soft);white-space:nowrap}
th{font-weight:600;color:var(--ink-soft);font-size:13px}
td.t{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:rgba(38,32,26,.85);z-index:30;font-size:14px;font-weight:500;max-width:calc(100% - 32px);display:none}
.toast.show{display:block;animation:pop .2s ease-out}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:820px){
  .stage{padding:0}
  .window{border-radius:0;border-left:0;border-right:0}
  .body{flex-direction:column}
  .side{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--stroke-soft);padding:8px 10px;overflow-x:auto}
  .side .brand{display:none}
  .side button{flex:none}
  .main{padding:16px}
  .live,.wallet{grid-template-columns:1fr}
  .reader{position:static}
  .form{grid-template-columns:1fr}
  .dockwrap{padding-top:8px}
  .dock button .ic{width:40px;height:40px}
  .menubar .sync span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* contas e administração */
[hidden]{display:none!important}
.tname{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who-btn{border:1px solid var(--stroke-soft);background:var(--glass);border-radius:7px;padding:2px 10px;font-size:12.5px;font-weight:600;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-btn:hover{background:var(--glass-hi)}
.gate{display:flex;align-items:flex-start;justify-content:center;padding-top:5vh}
.gatebox{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.gatebox h2{margin:0;font-size:22px;letter-spacing:-.02em}
.gatebox .sub{margin:0}
.gatelogo{width:170px;margin-bottom:6px}
.gateform{display:flex;flex-direction:column;gap:14px}
.gatebox .seg{align-self:flex-start}
.gatebox .err{margin:0;min-height:0}
.gatebox .note{margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;text-underline-offset:3px;align-self:flex-start;font-size:14px}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin:0 0 18px;padding:0 2px}
.stats b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:13px;color:var(--ink-soft)}
.nums{font-size:13px;color:var(--ink-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.codebox{margin-top:auto;padding:10px;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--stroke-soft)}
.codebox b{display:block;font-size:14px;color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.pwrow{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
@media (max-width:820px){.codebox{display:none}.nums{display:none}.pwrow{grid-template-columns:1fr}.tname{display:none}}
.qr{width:96px;height:96px;flex:none;background:#fff;border-radius:10px;padding:5px;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qrbig{width:min(260px,78%);margin:0 auto 16px;border-radius:14px;overflow:hidden;background:#fff}
.qrbig img{width:100%;display:block}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-soft);font-size:14.5px}
.wbtn{background:#000;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14.5px}
.wbtn:hover{background:#1c1c1c}
.cam{border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;display:grid;place-items:center}
.cam video{width:100%;height:100%;object-fit:cover}
.cam-msg{min-height:22px;margin-top:10px;font-weight:600}
.cam-msg.ok{color:var(--ok)}.cam-msg.dup{color:var(--wait)}.cam-msg.err{color:var(--bad)}
.av{object-position:50% 20%}
.av.ph{width:66px;height:88px;border-radius:10px}
.photo .av.ph{width:60px;height:80px}
.photo>:first-child{flex:none}
.photo .field{flex:1;min-width:0}
.need{padding:22px;display:flex;flex-direction:column;gap:10px;max-width:420px}
.need h3{margin:0;font-size:19px}
.need p{margin:0;color:var(--ink-soft);font-size:14.5px}
.tips{margin:0;padding-left:20px;color:var(--ink-soft);font-size:14.5px;display:flex;flex-direction:column;gap:6px}
/* frequência do aluno */
.sec{margin:0 0 22px}
.sec h3{margin:0 0 10px;font-size:17px;font-weight:700}
.hmwrap{overflow-x:auto;padding:2px 2px 8px}
.hmin{width:max-content}
.hmm{display:grid;grid-template-columns:repeat(26,13px);gap:3px;margin:0 0 4px 30px;font-size:11px;color:var(--ink-soft);height:14px}
.hmm span{white-space:nowrap}
.hmrow{display:flex;gap:6px}
.hmd{display:grid;grid-template-rows:repeat(7,13px);gap:3px;font-size:10.5px;color:var(--ink-faint);width:24px;line-height:13px}
.hmgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px}
.hm{width:13px;height:13px;border-radius:3px;border:0;padding:0;background:rgba(255,255,255,.08)}
.hm.l1{background:rgba(220,184,114,.42)}.hm.l2{background:rgba(220,184,114,.72)}.hm.l3{background:var(--gold)}
.hm.lx{background:rgba(255,116,102,.45)}
.hm.lh{background:rgba(244,197,82,.5)}
.h2g{display:flex;align-items:center;gap:10px}
.tileacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn.ic{padding:6px 9px;display:inline-flex;align-items:center}
.viewonly{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:rgba(244,197,82,.1);border:1px solid rgba(244,197,82,.25);font-size:13.5px}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}

<body>
<div class="menubar">
  <img src="mark.png" alt="">
  <b>TOCA tag</b>
  <span id="tname" class="tname"></span>
  <span class="sp"></span>
  <span class="sync" id="sync"><i></i><span>Carregando</span></span>
  <button class="who-btn" id="acct" data-act="account" hidden></button>
  <span id="clock"></span>
</div>
<div class="stage">
  <div class="window glass">
    <div class="titlebar"><h1 id="wtitle">TOCA tag</h1></div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="dockwrap" id="dockwrap"><nav class="dock glass" id="dock" aria-label="Áreas do aplicativo"></nav></div>
<div class="veil" id="veil"><div class="sheet glass" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast glass" id="toast" role="status"></div>

<script src="vendor/qrcode.js"></script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLS=["students","classes","sessions"];
const data={students:new Map(),classes:new Map(),sessions:new Map()};
let users=[],tenants=[],alunoSenha={},insts=[],just={},logs=[],courses={},rules={hours:false,pMin:75,parMin:25};
const nrules=x=>({hours:!!(x&&x.hours),unit:x&&x.unit==="t"?"t":"p",pMin:(x&&x.pMin)||75,parMin:(x&&x.parMin)||25,pT:(x&&x.pT)||60,parT:(x&&x.parT)||15}); // unit "p": % da aula; "t": tempo em sala, em minutos
const fmtMin=m=>m<60?m+" min":(m%60?Math.floor(m/60)+" h "+(m%60)+" min":(m/60)+" h");
const setRules=x=>{rules=nrules(x);}; // regra antiga da instituição: vale só para turmas que ainda não têm regra própria
const rulesOf=s=>s&&s.rules?nrules(s.rules):s&&s.classId&&data.classes.get(s.classId)&&data.classes.get(s.classId).rules?nrules(data.classes.get(s.classId).rules):rules;
const classRules=c=>c&&c.rules?nrules(c.rules):rules;
const rulesText=R=>!R.hours?"Presença pela leitura do cartão":R.unit==="t"?"Presença pelas horas: presente com "+fmtMin(R.pT)+" em sala, parcial com "+(R.parT<=1?"qualquer permanência":fmtMin(R.parT)):"Presença pelas horas: presente com "+R.pMin+"% da aula, parcial com "+R.parMin+"%";
const MODES={entrada:"Na entrada",saida:"Na saída",ambas:"Entrada e saída"};
const ROLES={admin:"Administrador",secretaria:"Secretaria",professor:"Professor"};
const state={phase:"loading",me:null,tenant:null,area:"",tab:"alunos",q:"",aq:"",sessionId:null,blip:null,typed:"",loginTab:"equipe",err:"",aluno:null,alunoKey:null,online:true,askedPw:false,fSubj:"",fPer:"all",fFrom:"",fTo:"",day:null,rep:{view:"aulas",cls:"",course:"",per:"all",from:"",to:"",min:"",q:""},lg:{q:"",type:"",by:"",per:"all",from:"",to:""},pf:{q:"",cls:"",per:"all",from:"",to:""},of:{q:"",cls:"",by:"",per:"all",from:"",to:""},flt:{aCls:"",aCourse:"",aSit:"",aOrd:"nome",tq:"",tProf:"",tMode:"",tSit:"",pq:"",pCls:"",pSit:"",sq:""}};
/* Palavras que mudam entre faculdade e escola */
const L=t=>(t||state.tenant||{}).type==="escola"?{ra:"Matrícula",course:"Série",kind:"Escola"}:{ra:"RA",course:"Curso",kind:"Faculdade"};

/* ---------- ícones ---------- */
const I={
  alunos:'<path d="M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19"/><circle cx="10" cy="8" r="3.5"/><path d="M20 19v-1.5a3.5 3.5 0 0 0-2.5-3.3M15.5 4.7a3.5 3.5 0 0 1 0 6.6"/>',
  turmas:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/>',
  relatorios:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  logins:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1.5A4.5 4.5 0 0 1 9.5 14h5a4.5 4.5 0 0 1 4.5 4.5V20"/>',
  instituicao:'<path d="M3 10 12 4l9 6M5 10v9M19 10v9M9 19v-6h6v6M3 19h18"/>',
  professor:'<path d="M5 9a7 7 0 0 1 14 0M8.5 9a3.5 3.5 0 0 1 7 0"/><circle cx="12" cy="9.5" r="1.2"/><rect x="6" y="13" width="12" height="8" rx="2"/>',
  freq:'<path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/>',
  equipe:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  logs:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="18" r=".8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', nfc:'<path d="M6 8a6 6 0 0 1 0 8M10 5.5a10 10 0 0 1 0 13M14 3a14 14 0 0 1 0 18"/>'
};
const ico=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- servidor ---------- */
async function api(method,url,body){
  let r;
  try{r=await fetch("api/"+url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});}
  catch(e){throw new Error("Sem conexão com o servidor. Tente de novo.");}
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.erro)||"Não foi possível concluir. Tente de novo.");
  return j||{};
}
async function load(){
  if(state.me.role==="admin"){tenants=(await api("GET","admin/tenants")).tenants||[];}
  else{const j=await api("GET","data");for(const c of COLS)data[c]=new Map(Object.entries(j[c]||{}));tagIds();users=j.users||[];alunoSenha=j.alunoSenha||{};just=j.just||{};logs=j.logs||[];courses=j.courses||{};setRules(j.settings);if(j.me)state.me={...state.me,...j.me};
  if(j.v){if(!state.v)state.v=j.v;else if(j.v!==state.v)newVersion();}}
function newVersion(){ // o aplicativo foi atualizado no servidor: recarrega a tela quando não atrapalha
  if(!$("#sheet").innerHTML&&!activeSession()){location.reload();return;}
  if(!newVersion.t)newVersion.t=setInterval(()=>{if(!$("#sheet").innerHTML&&!activeSession())location.reload();},8000);
  if(!newVersion.told){newVersion.told=true;toast("O TOCA tag foi atualizado. Recarregue a página quando terminar o que está fazendo.");}
}
  state.online=true;render();
}
let es=null;
function connect(){
  load().catch(e=>toast(e.message));
  if(es)es.close();
  try{es=new EventSource("api/events");es.onmessage=()=>load().catch(()=>{});es.onopen=()=>{const back=state.online===false;state.online=true;render();if(back)load().catch(()=>{});};es.onerror=()=>{state.online=false;render();};}catch(e){}
}
const chains={};
function tagIds(){for(const [k,v] of data.sessions)if(v&&v.id!==k)Object.defineProperty(v,"id",{value:k,enumerable:false,configurable:true});}
function save(col,id,body){
  data[col].set(id,body);tagIds();render();
  const k=col+"/"+id;
  const p=(chains[k]||Promise.resolve()).catch(()=>{}).then(()=>api("PUT",k,body));
  chains[k]=p;return p.catch(e=>{toast(e.message);load().catch(()=>{});});
}
function remove(col,id){
  data[col].delete(id);render();
  const k=col+"/"+id;
  const p=(chains[k]||Promise.resolve()).catch(()=>{}).then(()=>api("DELETE",k));
  chains[k]=p;return p.catch(e=>{toast(e.message);load().catch(()=>{});});
}
const newId=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
async function boot(){
  try{state.alunoKey=localStorage.getItem("tocatag.aluno.t")||null;}catch(e){}
  api("GET","instituicoes").then(j=>{insts=j.nomes||[];if(state.phase==="login")render();}).catch(()=>{});
  let r;
  try{r=await api("GET","me");}catch(e){state.phase="login";state.err=e.message;render();return;}
  if(r.setup){state.phase="setup";render();return;}
  if(r.user){enter(r);return;}
  if(r.aviso)state.err=r.aviso;
  if(state.alunoKey){state.phase="aluno";render();loadAluno();return;}
  state.phase="login";render();
}
function enter(r){
  state.me=r.user;state.tenant=r.tenant;state.phase="app";state.err="";
  state.area=r.user.role==="admin"?"admin":r.user.role==="secretaria"?"instituicao":"professor";
  render();connect();
}
function alunoOut(msg){state.aluno=null;state.alunoKey=null;state.err=msg||"";state.loginTab="aluno";state.phase="login";try{localStorage.removeItem("tocatag.aluno.t");}catch(x){}}
function alunoIn(j){setRules(j.settings);state.aluno=j;state.alunoKey=j.token;state.phase="aluno";state.err="";try{localStorage.setItem("tocatag.aluno.t",j.token);}catch(x){}}
async function loadAluno(){
  if(!state.alunoKey)return;
  try{alunoIn(await api("POST","aluno",{token:state.alunoKey}));}
  catch(e){if(!state.aluno||/Entre de novo/.test(e.message))alunoOut(state.aluno?"":e.message);}
  render();
}
const pickerOpen=()=>{const a=document.activeElement;return !!a&&(a.type==="date"||a.tagName==="SELECT");};
setInterval(()=>{if(state.phase==="aluno"&&!pickerOpen())loadAluno();},20000);
async function logout(){
  try{await api("POST","logout");}catch(e){}
  if(es){es.close();es=null;}
  state.me=null;state.tenant=null;state.phase="login";state.sessionId=null;state.loginTab="equipe";for(const c of COLS)data[c]=new Map();users=[];tenants=[];render();
}

/* ---------- utilidades ---------- */
const fmtT=ts=>ts?new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
const fmtD=ts=>new Date(ts).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
const fmtDay=ts=>ts?new Date(ts).toLocaleDateString("pt-BR"):"";
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtDur=ms=>{const m=Math.round(ms/60000),hh=Math.floor(m/60),mm=m%60;return hh?(mm?hh+" h "+mm+" min":hh+" h"):mm+" min";};
const normUid=s=>String(s||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
const initials=n=>String(n||"?").trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
function avatar(st,cls=""){
  const ok=st&&typeof st.photo==="string"&&st.photo.startsWith("data:image/");
  return ok?`<img class="av ${cls}" src="${esc(st.photo)}" alt="Foto de ${esc(st.name)}">`:`<span class="av ${cls}" aria-hidden="true">${esc(initials(st&&st.name))}</span>`;
}
const sorted=(m,f)=>[...m.entries()].map(([id,v])=>({id,...v})).sort(f);
const students=()=>sorted(data.students,(a,b)=>String(a.name).localeCompare(String(b.name),"pt-BR"));
const classes=()=>sorted(data.classes,(a,b)=>String(a.name).localeCompare(String(b.name),"pt-BR"));
const sessions=()=>sorted(data.sessions,(a,b)=>(b.startedAt||0)-(a.startedAt||0));
const roster=cid=>students().filter(s=>Array.isArray(s.classIds)&&s.classIds.includes(cid));

function statusOfRec(mode,r){
  if(!r)return{k:"bad",t:"Ausente"};
  if(mode==="ambas"){if(r.in&&r.out)return{k:"ok",t:"Presente"};return{k:"wait",t:r.in?"Falta a saída":"Falta a entrada"};}
  if(mode==="saida")return r.out?{k:"ok",t:"Presente"}:{k:"bad",t:"Ausente"};
  return r.in?{k:"ok",t:"Presente"}:{k:"bad",t:"Ausente"};
}
/* Avalia um aluno em uma aula: situação, tempo em sala (ms) e duração prevista da aula (dur).
   Regra por horas (opcional, definida pela secretaria): vale para chamadas encerradas e compara o tempo em sala com a duração da aula. */
const CAP=6*3600000;
function evalRec(s,r,jst){
  const e=evalRaw(s,r);
  return jst&&e.k!=="ok"?{k:"just",t:"Justificada",ms:e.ms,dur:0,just:true}:e; // falta justificada: não conta como falta nem entra nas horas previstas
}
function evalRaw(s,r){
  const live=statusOfRec(s.mode,r),dur=s.endedAt?Math.min(Math.max(0,s.endedAt-s.startedAt),CAP):0;
  let ini=null,fim=null;
  if(r){ini=r.in||(s.mode==="saida"&&r.out?s.startedAt:null);fim=r.out||(s.mode==="entrada"&&r.in?s.endedAt:null);}
  let ms=0;if(ini&&fim&&s.endedAt){const a=Math.max(ini,s.startedAt),b=Math.min(fim,s.endedAt);ms=Math.max(0,Math.min(b-a,CAP));}
  const R=rulesOf(s);
  if(!R.hours||!s.endedAt)return {k:live.k,t:live.t,ms:live.k==="ok"?ms:0,dur};
  if(!r)return {k:"bad",t:"Ausente",ms:0,dur,hrs:true};
  if(!ini||!fim)return {k:"wait",t:ini?"Parcial, sem saída":"Parcial, sem entrada",ms:0,dur,par:true,hrs:true};
  const pct=dur?100*ms/dur:0;
  if(R.unit==="t"?ms>=R.pT*60000:pct>=R.pMin)return {k:"ok",t:"Presente",ms,dur,hrs:true};
  if(R.unit==="t"?ms>=R.parT*60000:pct>=R.parMin)return {k:"wait",t:"Parcial",ms,dur,par:true,hrs:true};
  return {k:"bad",t:"Ausente",ms,dur,hrs:true};
}
const fmtSaldo=ms=>{const m=Math.round(ms/60000);return m===0?"0 h":(m<0?"−":"+")+fmtDur(Math.abs(m)*60000);};

function beep(ok){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;beep.c=beep.c||new C();const c=beep.c,o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?1040:300;g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(ok?.11:.28));}catch(e){}}
function readPhoto(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const W=240,H=320,c=document.createElement("canvas");c.width=W;c.height=H;let sw=img.width,sh=img.width*4/3;if(sh>img.height){sh=img.height;sw=img.height*3/4;}c.getContext("2d").drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,W,H);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.75));};img.onerror=()=>rej(new Error("img"));img.src=u;});}
/* NFC do próprio celular (Web NFC): existe no Chrome para Android, em endereço https. */
let nfc=null;
async function nfcScan(onUid){
  if(!("NDEFReader" in window)){toast("A leitura por NFC do celular funciona no Chrome para Android, pelo tocatag.net. No iPhone, use o QR code, o leitor USB ou a presença manual.");return;}
  if(nfc){nfc.cb=onUid;toast("O NFC já está ativo. Encoste o cartão na parte de trás do celular.");return;}
  try{
    const r=new NDEFReader();await r.scan();nfc={cb:onUid};
    r.onreading=e=>{if(nfc&&e.serialNumber)nfc.cb(e.serialNumber);else toast("Este cartão não informou o número. Tente outro cartão.");};
    r.onreadingerror=()=>toast("Não deu para ler este cartão. Encoste de novo e segure um instante.");
    state.nfcOn=true;render();toast("NFC ativo. Encoste o cartão na parte de trás do celular.");
  }catch(e){toast(e&&e.name==="NotAllowedError"?"Permita o uso do NFC para este site e toque no botão de novo.":"Não foi possível ativar o NFC. Confira se o NFC do celular está ligado.");}
}
/* O mesmo cartão sai em formatos diferentes conforme o leitor: hexadecimal (celular), hexadecimal invertido ou decimal (leitores USB). */
function uidForms(raw){
  const u=normUid(raw),f=new Set();if(!u)return f;f.add(u);
  const add=hex=>{if(!hex||hex.length%2||hex.length>20)return;const rev=hex.match(/../g).reverse().join("");
    for(const x of [hex,rev]){f.add(x);try{const d=BigInt("0x"+x).toString();f.add(d);f.add(d.padStart(10,"0"));}catch(e){}}};
  if(/^[0-9A-F]+$/.test(u))add(u);
  if(/^[0-9]+$/.test(u)){f.add(u.replace(/^0+/,"")||"0");try{let hx=BigInt(u).toString(16).toUpperCase();if(hx.length%2)hx="0"+hx;add(hx);add(hx.padStart(8,"0"));}catch(e){}}
  return f;
}
function sameCard(stored,readForms){const s=normUid(stored);if(!s)return false;if(readForms.has(s))return true;for(const x of uidForms(s))if(readForms.has(x))return true;return false;}
const suggestCode=n=>(String(n).normalize("NFD").replace(/[^A-Za-z ]/g,"").split(/\s+/).filter(w=>w.length>2).map(w=>w[0]).join("").toUpperCase().slice(0,5)||"INST")+String(Math.floor(100+Math.random()*900));

function activeSession(){const s=state.sessionId&&data.sessions.get(state.sessionId);return s&&!s.endedAt?{id:state.sessionId,...s}:null;}
function setBlip(b){state.blip={...b,at:Date.now()};beep(b.kind==="ok");clearTimeout(setBlip.t);setBlip.t=setTimeout(()=>{if(state.blip)state.blip.idle=true;render();},6000);render();}
function mark(st,manual,sure){
  const se=activeSession();if(!se)return;
  if(se.confirm&&!manual&&!sure){ // chamada com conferência: a leitura só vale depois que o professor confirma a foto
    state.blip={student:st,msg:"Confira a foto e confirme a presença.",kind:"ask",at:Date.now()};beep(true);clearTimeout(setBlip.t);render();return;}
  const now=Date.now(),recs={...(se.records||{})},r={...(recs[st.id]||{})};let msg,kind="ok";
  if(se.mode==="entrada"){if(r.in){msg="Entrada já registrada às "+fmtT(r.in);kind="dup";}else{r.in=now;msg="Entrada registrada às "+fmtT(now);}}
  else if(se.mode==="saida"){if(r.out){msg="Saída já registrada às "+fmtT(r.out);kind="dup";}else{r.out=now;msg="Saída registrada às "+fmtT(now);}}
  else{if(!r.in){r.in=now;msg="Entrada registrada às "+fmtT(now);}
    else if(!r.out){if(!manual&&now-r.in<4000){msg="Entrada registrada agora mesmo. Para a saída, aproxime o cartão de novo daqui a alguns segundos.";kind="dup";}else{r.out=now;msg="Saída registrada às "+fmtT(now);}}
    else{msg="Entrada e saída já registradas";kind="dup";}}
  if(kind==="ok"){if(manual)r.manual=true;recs[st.id]=r;const {id,...body}=se;save("sessions",id,{...body,records:recs});}
  setBlip({student:st,msg,kind});
}
function unmark(sid){const se=activeSession();if(!se)return;const recs={...(se.records||{})};delete recs[sid];const {id,...body}=se;save("sessions",id,{...body,records:recs});}
function handleUid(raw){
  const uid=normUid(raw),se=activeSession();if(!uid||!se)return;
  const forms=uidForms(uid),st=students().find(s=>sameCard(s.cardUid,forms));
  if(!st)return setBlip({kind:"err",msg:"Cartão não cadastrado",detail:"Código lido: "+uid});
  if(!(st.classIds||[]).includes(se.classId))return setBlip({student:st,kind:"err",msg:"Não está matriculado nesta turma"});
  mark(st,false);
}
function handleCode(code){
  const se=activeSession();if(!se)return;
  const st=roster(se.classId).find(s=>s.cardCode&&s.cardCode===code);
  if(!st)return setBlip({kind:"err",msg:"Código não encontrado nesta turma",detail:"Peça ao aluno o código que aparece no cartão digital dele."});
  mark(st,false);
}

/* QR code do aluno: TOCA1.<aluno>.<chave>. É fixo e só muda quando o aluno gera um novo. */
function handleQr(text){
  const se=activeSession();if(!se)return;
  const m=/^TOCA(1)\.([A-Za-z0-9_-]+)\.(.+)$/.exec(String(text).trim());
  if(!m)return setBlip({kind:"err",msg:"Este QR code não é do TOCA tag"});
  const raw=data.students.get(m[2]);
  if(!raw)return setBlip({kind:"err",msg:"Aluno não encontrado nesta instituição"});
  const st={id:m[2],...raw};
  if(!(st.classIds||[]).includes(se.classId))return setBlip({student:st,kind:"err",msg:"Não está matriculado nesta turma"});
  if(!st.walletKey||st.walletKey!==m[3])return setBlip({student:st,kind:"err",msg:"QR code antigo ou inválido",detail:"Peça ao aluno para abrir o cartão de novo."});
  mark(st,false);
}
let scan=null;
function stopScan(){if(scan){scan.on=false;try{scan.stream.getTracks().forEach(t=>t.stop());}catch(e){}scan=null;}}
const loadScript=src=>new Promise((ok,bad)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s);});
async function scanSheet(){
  openSheet(`<h2>Ler QR code</h2><p class="sub">Aponte a câmera para o QR code do cartão digital ou da Carteira do aluno.</p><div class="cam"><video id="cam" playsinline muted></video></div><div class="cam-msg" id="cam-msg" role="status"></div><div class="foot"><button class="btn gold" data-act="close">Fechar</button></div>`);
  const say=(t,k)=>{const e=$("#cam-msg");if(e){e.textContent=t;e.className="cam-msg "+(k||"");}};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say("A câmera só funciona em endereço seguro (https). Abra o aplicativo pelo tocatag.net.","err");return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});}
  catch(e){say("Não foi possível abrir a câmera. Permita o acesso à câmera no navegador e tente de novo.","err");return;}
  const v=$("#cam");if(!v){stream.getTracks().forEach(t=>t.stop());return;}
  scan={stream,on:true};v.srcObject=stream;try{await v.play();}catch(e){}
  let det=null;if("BarcodeDetector" in window){try{det=new BarcodeDetector({formats:["qr_code"]});}catch(e){}}
  if(!det&&!window.jsQR){try{await loadScript("vendor/jsQR.js");}catch(e){say("Não foi possível carregar o leitor de QR code.","err");return;}}
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});let last="",lastAt=0;
  const loop=async()=>{
    if(!scan||!scan.on)return;
    if(v.readyState>=2&&v.videoWidth){let text="";
      try{if(det){const r=await det.detect(v);if(r[0])text=r[0].rawValue;}
        else{const s=Math.min(1,640/v.videoWidth);cv.width=Math.round(v.videoWidth*s);cv.height=Math.round(v.videoHeight*s);cx.drawImage(v,0,0,cv.width,cv.height);const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r)text=r.data;}}catch(e){}
      if(text&&(text!==last||Date.now()-lastAt>4000)){last=text;lastAt=Date.now();handleQr(text);const b=state.blip;if(b)say((b.student?b.student.name+": ":"")+b.msg,b.kind);}}
    setTimeout(loop,250);};
  loop();
}
const qrSvg=(text,cell)=>{try{const g=qrcode(0,"M");g.addData(text);g.make();return g.createSvgTag({cellSize:cell,margin:0,scalable:true});}catch(e){return "";}};
/* QR code como imagem PNG, com fundo branco e margem: dá para salvar em Fotos segurando o dedo. */
function qrPng(text){
  try{const g=qrcode(0,"M");g.addData(text);g.make();const n=g.getModuleCount(),cell=16,pad=cell*4,S=n*cell+pad*2,c=document.createElement("canvas");c.width=c.height=S;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,S,S);x.fillStyle="#000";
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(g.isDark(r,k))x.fillRect(pad+k*cell,pad+r*cell,cell,cell);
    return c.toDataURL("image/png");}catch(e){return "";}
}

/* Frequência do aluno. Chamada ainda aberta e sem registro não conta como falta.
   Horas: da entrada (ou início da chamada) até a saída (ou fim da chamada), no máximo 6 h por aula. */

function rangeOf(per,f,t){
  const d=new Date();let from=0,to=Infinity;
  if(per==="custom"){if(f)from=new Date(f+"T00:00:00").getTime();if(t)to=new Date(t+"T23:59:59.999").getTime();}
  else if(per==="month")from=new Date(d.getFullYear(),d.getMonth(),1).getTime();
  else if(per==="sem")from=new Date(d.getFullYear(),d.getMonth()<6?0:6,1).getTime();
  else if(per==="30"||per==="90")from=Date.now()-Number(per)*86400000;
  return [from,to];

  const [from,to]=rangeOf(state.fPer,state.fFrom,state.fTo);
  const subj=alunoSubjects(a).some(([k])=>k===state.fSubj)?state.fSubj:"";
  return a.sessions.filter(s=>(!subj||subjKey(s)===subj)&&(s.startedAt||0)>=from&&(s.startedAt||0)<=to);

/* Frequência: com a regra por horas, é horas cumpridas ÷ horas previstas; sem ela, presenças ÷ aulas. */

const pcs=x=>x===null?"–":x+"%";

      if(dt>end){cells+=`<span class="hm off"></span>`;continue;}
      const k=dayKey(dt.getTime()),v=days.get(k),lvl=!v?"0":v.p===0?(v.par?"h":v.jus===v.t?"j":"x"):String(Math.min(3,v.p));
      const label=dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})+": "+(v?v.p+" de "+v.t+(v.t===1?" aula":" aulas")+" com presença":"sem aula");
      cells+=`<button class="hm l${lvl}${state.day===k?" sel":""}" data-act="day" data-v="${k}" title="${label}" aria-label="${label}"></button>`;
    }
  }
  return `<div class="hmwrap" id="hmwrap"><div class="hmin"><div class="hmm" aria-hidden="true">${months}</div><div class="hmrow"><div class="hmd" aria-hidden="true"><span></span><span>seg</span><span></span><span>qua</span><span></span><span>sex</span><span></span></div><div class="hmgrid">${cells}</div></div></div></div>
  <div class="hmleg"><span><i style="background:rgba(255,255,255,.08)"></i>Sem aula</span><span><i style="background:rgba(255,116,102,.45)"></i>Faltou</span><span><i style="background:rgba(143,184,255,.5)"></i>Justificada</span>${anyHours()?`<span><i style="background:rgba(244,197,82,.5)"></i>Parcial</span>`:""}<span><i style="background:rgba(220,184,114,.42)"></i>1 aula</span><span><i style="background:rgba(220,184,114,.72)"></i>2 aulas</span><span><i style="background:var(--gold)"></i>3 ou mais</span></div>`;
}
function alunoFreq(a,list){

    ${state.fPer==="custom"&&state.fFrom&&state.fTo&&state.fFrom>state.fTo?`<p class="note" style="margin:0 0 12px;color:var(--bad)">A data inicial está depois da data final.</p>`:filtered&&!x.tot?`<p class="note" style="margin:0 0 12px">Nenhuma aula encerrada neste filtro.</p>`:""}
    <div class="stats"><div><b>${x.pres}</b><span>presenças</span></div>${H?`<div><b>${x.par}</b><span>parciais</span></div>`:""}<div><b>${x.tot-x.pres-x.par-x.jus}</b><span>faltas</span></div>${x.jus?`<div><b>${x.jus}</b><span>justificadas</span></div>`:""}<div><b>${pcs(pct)}</b><span>${H?"das horas cumpridas":"de frequência"}</span></div><div><b>${x.ms?fmtDur(x.ms):"0 h"}</b><span>em aula, de ${x.prev?fmtDur(x.prev):"0 h"}</span></div><div><b>${fmtSaldo(x.ms-x.prev)}</b><span>saldo de horas</span></div></div>
    ${heatmap(x.days,state.fPer==="custom"?state.fTo:"")}
    ${state.day?`<div class="daybox"><div class="lbl" style="margin-bottom:6px">${esc(dayLabel)}</div><div class="card rows">${dv?dv.items.map(s=>{const st=evalRec(s,s.record,s.just),r=s.record||{};return `<div class="row"><span class="who"><b>${esc(s.className||"Turma")}</b><span>${fmtT(s.startedAt)}${s.endedAt?" às "+fmtT(s.endedAt):""}${r.in?", entrou "+fmtT(r.in):""}${r.out?", saiu "+fmtT(r.out):""}${st.ms?", "+fmtDur(st.ms)+" em sala":""}</span></span><span class="chip ${st.k}">${st.t}</span></div>`;}).join(""):`<div class="row"><span class="who"><span>Nenhuma aula registrada neste dia.</span></span></div>`}</div></div>`:`<p class="note" style="margin-top:8px">Toque em um dia para ver as aulas dele.</p>`}
  </div>
  <div class="sec"><h3>Por matéria</h3>${x.subj.length?`<div class="card tbl"><table class="subj"><thead><tr><th>Matéria</th><th class="num">Aulas</th><th class="num">Presenças</th><th class="num">Faltas</th><th class="num">Frequência</th><th class="num">Horas</th><th class="num">Saldo</th></tr></thead><tbody>${x.subj.map(q=>`<tr><td>${esc(q.name)}</td><td class="num">${q.t}</td><td class="num">${q.p}${H&&q.par?" + "+q.par+" parc.":""}</td><td class="num">${q.t-q.p-q.par-q.jus}${q.jus?" + "+q.jus+" just.":""}</td><td class="num">${pcs(freqPct(q))}</td><td class="num">${q.ms?fmtDur(q.ms):"0 h"}</td><td class="num">${fmtSaldo(q.ms-q.prev)}</td></tr>`).join("")}</tbody><tfoot><tr><th>Total</th><th class="num">${x.tot}</th><th class="num">${x.pres}${H&&x.par?" + "+x.par+" parc.":""}</th><th class="num">${x.tot-x.pres-x.par-x.jus}${x.jus?" + "+x.jus+" just.":""}</th><th class="num">${pcs(pct)}</th><th class="num">${x.ms?fmtDur(x.ms):"0 h"}</th><th class="num">${fmtSaldo(x.ms-x.prev)}</th></tr></tfoot></table></div><p class="note">Saldo de horas: tempo em sala menos a duração das aulas. Negativo indica horas a menos. Falta justificada não conta como falta nem entra nas horas previstas.${H?" Nas matérias com presença pelas horas, a situação depende do tempo que você ficou em sala.":""}</p>`:`<div class="card empty"><b>${filtered?"Nenhuma aula neste filtro":"Nenhuma aula ainda"}</b>${filtered?"Troque a matéria ou o período.":"O resumo por matéria aparece depois da primeira chamada."}</div>`}</div>`;
}

function paint(){

  const ac=$("#acct");ac.hidden=P!=="app";if(P==="app")ac.textContent=state.me.name;

  const sy=$("#sync");sy.hidden=P!=="app";sy.className="sync "+(state.online?"on":"off");sy.lastElementChild.textContent=state.online?"Conectado":"Sem conexão";
  tick();

function signPad(cv){

  cv.addEventListener("pointerdown",e=>{e.preventDefault();on=true;used=true;[lx,ly]=pos(e);try{cv.setPointerCapture(e.pointerId);}catch(_){ }x.beginPath();x.arc(lx,ly,1.1,0,6.3);x.fillStyle="#111";x.fill();});

}

    case "repcopy":repExport("copy");break;
    case "repcsv":repExport("csv");break;
    case "repprint":window.print();break;
    case "start":startSheet(v);break;
    case "resume":state.sessionId=v;state.blip=null;render();break;
    case "back":state.sessionId=null;render();break;
    case "end":confirmSheet("Encerrar a chamada?","Depois de encerrada, novas leituras não são aceitas. Quem não registrou presença fica como ausente.","Encerrar chamada",()=>{const se=activeSession();if(!se)return;const {id,...body}=se;save("sessions",id,{...body,endedAt:Date.now()});state.sessionId=null;toast("Chamada encerrada");});break;
    case "manual":{const st=data.students.get(v);if(st)mark({id:v,...st},true);break;}
    case "undo":unmark(v);break;
    case "nfc":nfcScan(handleUid);break;
    case "scan":scanSheet();break;
    case "wallet":addWallet(v);break;
    case "walletqr":walletQrSheet();break;
    case "walletqrnew":walletQrSheet(true);break;
    case "newcard":confirmSheet("Gerar novo código e QR code?","O número e o QR code atuais param de funcionar na hora. Se você guardou o cartão na Carteira do celular, vai precisar refazer.","Gerar novos",async()=>{if(await newCard())toast("Novo código e QR code gerados.");});break;
    case "leave":alunoOut();state.askedPw=false;render();break;
    case "alunopw":alunoPwSheet();break;
    case "day":state.day=state.day===v?null:v;render();break;
    case "alunofoto":alunoFotoSheet();break;
    case "forgot":forgotSheet();break;
    case "resetpw":confirmSheet("Redefinir a senha deste aluno?","A senha atual é apagada. No próximo acesso, o aluno entra só com a matrícula e cria uma senha nova.","Redefinir senha",async()=>{try{await api("DELETE","students/"+v+"/senha");toast("Senha redefinida");}catch(x){toast(x.message);}load().catch(()=>{});});break;
    case "close":closeSheet();break;
  }
});
$("#veil").addEventListener("mousedown",e=>{if(e.target.id==="veil")closeSheet();});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){state.q=e.target.value;render();}
  if(e.target.id==="aq"){state.aq=e.target.value;render();}
  if(e.target.id==="r-q"){state.rep.q=e.target.value;render();}
  if(e.target.id==="lg-q"){state.lg.q=e.target.value;render();}
  if(e.target.id==="pf-q"){state.pf.q=e.target.value;render();}
  if(e.target.id==="of-q"){state.of.q=e.target.value;render();}
  if(e.target.dataset.f&&e.target.tagName==="INPUT"){state.flt[e.target.dataset.f]=e.target.value;render();}
  if(e.target.id==="code")e.target.value=e.target.value.replace(/\D/g,"");
});
document.addEventListener("change",e=>{
  if(e.target.id==="f-subj"){state.fSubj=e.target.value;state.day=null;render();}
  if(e.target.id==="f-per"){state.fPer=e.target.value;state.day=null;render();}
  if(e.target.id==="f-from"){state.fFrom=e.target.value;state.day=null;render();}
  if(e.target.id==="f-to"){state.fTo=e.target.value;state.day=null;render();}
  if(e.target.dataset.f&&e.target.tagName==="SELECT"){state.flt[e.target.dataset.f]=e.target.value;render();}
  const pk={"pf-cls":"cls","pf-per":"per","pf-from":"from","pf-to":"to"}[e.target.id];
  if(pk){state.pf[pk]=e.target.value;render();}
  const ok2={"of-cls":"cls","of-by":"by","of-per":"per","of-from":"from","of-to":"to"}[e.target.id];
  if(ok2){state.of[ok2]=e.target.value;render();}
  const lk={"lg-type":"type","lg-by":"by","lg-per":"per","lg-from":"from","lg-to":"to"}[e.target.id];
  if(lk){state.lg[lk]=e.target.value;render();}
  const rk={"r-view":"view","r-cls":"cls","r-course":"course","r-per":"per","r-from":"from","r-to":"to","r-min":"min"}[e.target.id];
  if(rk){state.rep[rk]=e.target.value;render();}
});
document.addEventListener("submit",async e=>{
  const id=e.target.id;
  if(id==="codeform"){e.preventDefault();const i=$("#code"),c=i.value.trim();i.value="";if(c.length===6)handleCode(c);else toast("O código tem 6 números.");}
  if(id==="setupform"||id==="loginform"){e.preventDefault();
    const body=id==="setupform"?{name:$("#su-name").value,login:$("#su-login").value,password:$("#su-pw").value}:{login:$("#lg-login").value,password:$("#lg-pw").value};
    try{await api("POST",id==="setupform"?"setup":"login",body);const r=await api("GET","me");if(r.user)enter(r);else{state.err=r.aviso||"Não foi possível entrar.";render();}}
    catch(x){state.err=x.message;const g=$("#gate-err");if(g)g.textContent=x.message;}}
  if(id==="alunoform"){e.preventDefault();
    try{const j=await api("POST","aluno/entrar",{inst:$("#al-inst").value,ra:$("#al-ra").value,password:$("#al-pw").value});alunoIn(j);render();
      if(!j.hasPassword&&!state.askedPw){state.askedPw=true;setTimeout(alunoPwSheet,300);}}
    catch(x){state.err=x.message;const g=$("#gate-err");if(g)g.textContent=x.message;}}
});
/* Leitor USB: digita o código do cartão e manda Enter. */
let lastKey=0;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#veil").classList.contains("open")){closeSheet();return;}
  if(state.phase!=="app"||state.area!=="professor"||!activeSession()||$("#veil").classList.contains("open"))return;
  const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA"))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const now=Date.now();if(now-lastKey>3000)state.typed="";lastKey=now;
  if(e.key==="Enter"){if(state.typed.length>=4){const u=state.typed;state.typed="";e.preventDefault();handleUid(u);}else state.typed="";}
  else if(e.key.length===1&&/[0-9a-zA-Z:]/.test(e.key))state.typed=(state.typed+e.key).slice(-32);
  else return;
  const el=$("#typing");if(el)el.textContent=state.typed;
});
window.addEventListener("focus",()=>{if(state.phase==="app")load().catch(()=>{});});
render();boot();
</script>
